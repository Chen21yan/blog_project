{% extends 'base.html' %}

{% block main %}
    <h1>{{ blog.title }}</h1>
    <hr>
    <div class="mt-2">
        <img src="{% static 'image/touxiang.jpg' %}" alt="" class="rounded-circle" width="30" height="30">
        <span class="ms-2">{{ blog.author.username }}</span>
        <span class="ms-2">于</span>
        <span class="ms-2">{{ blog.pub_time|date:"Y-m-d H:i " }}</span>发布
    </div>
    <hr>
    <div class="py-2">
        {{ blog.content|safe }}
    </div>
    <hr>
    <div class="mt-2">
        <h3>评论（10）</h3>
        <form action="" method="POST">
            <div class="mt-2">
                <input type="text" class="form-control" placeholder="请输入评论">
            </div>
            <div class="text-end mt-2">
                <button type="button" class="btn btn-warning">评论</button>
            </div>
        </form>
    </div>
    <div class="mt-2">
        <ul class="list-group list-group-flush">
            <li class="list-group-item">
                <div class="d-flex justify-content-between text-body-secondary">
                    <div class="user-info">
                        <img src="{% static 'image/touxiang.jpg' %}" alt="" class="rounded-circle" width="40" height="40">
                        <span class="ms-2">橙子</span>
                    </div>
                    <div class="creat-time" style="line-height: 40px;">2025年05月01日 20:18</div>
                </div>
                <div class="mt-2">这是评论的内容1。。。。。。</div>
            </li>
            <li class="list-group-item">
                <div class="d-flex justify-content-between text-body-secondary">
                    <div class="user-info">
                        <img src="{% static 'image/touxiang2.jpg' %}" alt="" class="rounded-circle" width="40" height="40">
                        <span class="ms-2">小橙子</span>
                    </div>
                    <div class="creat-time" style="line-height: 40px;">2025年05月01日 22:21</div>
                </div>
                <div class="mt-2">这是评论的内容2。。。。。。</div>
            </li>
        </ul>
    </div>
{% endblock %}
